name: Update data
on:
  schedule: [{cron: "15 */6 * * *"}]      # every 6 hours
  workflow_dispatch:
    inputs:
      batch: {description: "New locations to backfill this run", default: "40"}
permissions:
  contents: write
concurrency: update-data
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pandas scipy requests
      - run: python scripts/build_data.py
        env:
          BATCH: ${{ github.event.inputs.batch || '40' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit refreshed data
        run: |
          git config user.name "aralwatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: refresh $(date -u +%F-%H)" && git pull --rebase && git push)
