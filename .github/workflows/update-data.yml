name: Update data
on:
  schedule: [{cron: "0 4 * * *"}]   # daily, 04:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pandas scipy requests
      - run: python scripts/build_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "aralwatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/drought.json
          git diff --cached --quiet || (git commit -m "data: refresh $(date -u +%F)" && git push)
